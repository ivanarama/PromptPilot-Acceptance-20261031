name: Fixture validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  fixture-validation:
    name: fixture-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m json.tool payload.json
      - run: python -m json.tool base.json
